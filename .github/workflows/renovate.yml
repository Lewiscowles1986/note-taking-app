name: Renovate

on:
  push:
    branches:
      - main
  # Match renovate.json's "every weekend" schedule (Saturdays & Sundays, 06:00 UTC).
  # Weekday runs would be no-ops anyway — Renovate gates itself on that schedule.
  schedule:
    - cron: 0 6 * * 0,6

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Renovate
        run: npm install -g renovate

      - name: Validate Renovate config
        env:
          LOG_LEVEL: debug
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: renovate-config-validator

      - name: Run Renovate
        env:
          LOG_LEVEL: debug
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: renovate Lewiscowles1986/note-taking-app

      # - name: Run Renovate Bot
      #   uses: renovatebot/github-action@v43.0.14
      #   with:
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     log-level: debug