name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Grant the workflow the permissions it needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-progress runs on new pushes.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        # Queries the Pages API for the deployed site URL (origin + base path,
        # e.g. https://<owner>.github.io/<repo>). Runs before the build so the
        # og:image absolute URL can be composed from it; custom-domain aware
        # and needs no hard-coded URL.
        uses: actions/configure-pages@v6

      - name: Compute Pages base path
        id: base
        # A user/org site (repo named "<owner>.github.io") is served at the
        # domain root with no prefix; any other repo is a project site served
        # under "/<repo-name>/". Derive the Vite base from the repo name so
        # assets resolve correctly in either case.
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build project
        env:
          GITHUB_PAGES_BASE: ${{ steps.base.outputs.base }}
          # Absolute site base URL for og:image/twitter:image; composed onto a
          # page-relative asset path in vite.config.ts.
          PAGES_ASSET_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
