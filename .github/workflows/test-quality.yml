# Test Quality — coverage + mutation visualisation.
#
# Scope: Node.js LATEST only (resolved live from nodejs.org, not a pinned
# major) — this is the canary check; .github/workflows/ci.yml covers the
# support matrix.
#
# Mutation testing is SHARDED: mutation is the long pole (~28 min of a 45 min
# budget), and it is embarrassingly parallel by file, so the matrix below splits
# `src/lib` into disjoint `--mutate` subsets and merges the reports. Each shard
# still runs the whole test suite in its initial dry run, so coverage analysis
# stays correct. Shard membership lives in `.github/stryker-shards.json`.
#
# Report-only: it never gates a PR, so running it on this branch's PR is cheap.
#
# Triggers: main pushes (as before) plus pushes to the branch that introduced
# sharding, so its run is visible on that PR. Deliberately NOT `pull_request`:
# that filters by BASE branch, so it would fire for *every* PR into main — the
# opposite of the intended "this branch only" scope. Once merged, fold the
# branch back out and keep the original `push: branches: [main]` + `schedule`.
#
# Schedule: Mondays 06:00 UTC — deliberately after ci.yml (05:00) and
# devcontainer.yml (05:30) so a failing main doesn't waste a mutation run.

name: Test Quality

on:
  push:
    branches: [ main, fix/stryker-disable-type-checks-scope ]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (weekly)

permissions:
  contents: read

concurrency:
  group: test-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: Mutation shard ${{ matrix.shard }} of 5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest Node.js
        id: node
        run: |
          # dist/index.json is newest-first; the filter skips pre-releases
          # (e.g. vX.Y.Z-rc.1) so we always land on a stable release.
          latest=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[].version | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
          echo "version=${latest}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest Node.js: ${latest}"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Stryker 10 still needs the classic TS compiler API (ts.
      # parseConfigFileTextToJson) which TypeScript 7 removed — tracked as
      # stryker-mutator/stryker-js#6111. Until that ships, shadow the hoisted
      # `typescript` with the JS-based TS6 line for this job only.
      # --no-save keeps package.json/package-lock.json untouched; the next
      # `npm ci` on main restores TS7.
      - name: Shadow typescript with TS6 for Stryker
        run: >
          npm install --no-save --no-audit --no-fund
          "typescript@npm:@typescript/typescript6@^6.0.2"

      - name: Mutation testing (this shard)
        run: |
          mutate=$(node -p "require('./.github/stryker-shards.json').shards[${{ matrix.shard }}]")
          echo "Mutating: ${mutate}"
          npx stryker run --mutate "${mutate}"

      - name: Upload shard mutation report
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/mutation.json
          retention-days: 7

  report:
    name: Merge reports & coverage
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest Node.js
        id: node
        run: |
          latest=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -r '[.[].version | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
          echo "version=${latest}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & component tests with coverage
        run: npm run test:coverage

      - name: Download shard mutation reports
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: mutation-shard-*
          path: shards

      # Tolerate a failed shard: merge whatever arrived so the report still
      # publishes (it is report-only). If nothing arrived, skip rather than fail.
      - name: Merge shard mutation reports
        run: |
          mapfile -t shards < <(find shards -name '*.json' 2>/dev/null | sort)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "No shard reports found; leaving the mutation section as 'not available'."
            exit 0
          fi
          node scripts/merge-mutation-reports.mjs reports/mutation "${shards[@]}"

      - name: Build report (run summary + PR comment body)
        run: node scripts/test-quality-report.mjs pr-comment.md

      - name: Upload coverage HTML report
        if: always() && hashFiles('coverage/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload mutation HTML report
        if: always() && hashFiles('reports/mutation/mutation.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          retention-days: 14
