# electron-builder configuration for the desktop target.
#
# Everything the renderer needs is already bundled by Vite into
# dist-electron/, and the Electron runtime imports only node: builtins — so
# node_modules is excluded entirely. Shipping it would add hundreds of MB of
# React/mermaid/etc that never get executed.

appId: com.lewiscowles.notehaven
productName: Note Haven
directories:
  output: release
  buildResources: build-resources

# Only what actually runs. `electron/` is the shell, `dist-electron/` is the
# built app, and package.json supplies `main`.
files:
  - package.json
  - electron/**/*
  - "!electron/test/**/*"
  - dist-electron/**/*
  - "!node_modules/**/*"
  - "!dist-electron/**/*.map"

asar: true

mac:
  category: public.app-category.productivity
  # No `arch` here on purpose: leaving it unset lets `--universal` / `--arm64`
  # on the command line choose, which is what CI needs. A pinned arch would
  # override the flag and quietly build the wrong thing.
  target:
    - dmg
    - zip
  # The floor is set by the Electron runtime itself: Electron 45's framework
  # declares LSMinimumSystemVersion 13.0. Declaring anything lower would not
  # make the app run on an older macOS — dyld would fail against the framework
  # — so this states the real requirement rather than trying to look more
  # compatible. To genuinely support macOS 12 or older, the Electron major has
  # to come down; see docs/technical/electron.md.
  minimumSystemVersion: "13.0"
  # Ad-hoc sign. An arm64 macOS build must be signed to execute at all, and
  # without a Developer ID certificate ad-hoc is the only option. It is enough
  # to run locally, but a downloaded copy is still quarantined by Gatekeeper,
  # so the docs explain the right-click → Open / xattr step. Setting this to
  # null stops electron-builder from hunting for an identity that is not there.
  identity: null
  hardenedRuntime: false

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis

linux:
  target:
    - AppImage
  category: Office
